<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConverterEAJ | Conversor de moedas</title>
    <link
      rel="shortcut icon"
      href="imgs/real-brasileiro.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <header>
      <h1>ConverterEAJ</h1>
      <p>Conversor de moedas simples e prático.</p>
    </header>
    <main>
      <div class="conteiner">
        <!-- Centralizar -->
        <div class="box0">
          <h2>Conversor de moedas</h2>
          <p>Converter Real Brasileiro (BRL) para Dólar Americano (USD)</p>
        </div>

        <!-- Alinhar -->
        <div class="box1">
          <h4>De (Moeda origem)</h4>
          <p>
            <img src="imgs/brasil.png" alt="Bandeira do brasil" />BRL - Real
            Brasileiro
          </p>
        </div>

        <!-- Alinhar -->
        <div class="box2">
          <h4>Para (Moeda Destino)</h4>
          <p>
            <img src="imgs/estados-unidos.png" alt="Bandeira USA" />USD - Dólar
            Americano
          </p>
        </div>


        <div class="box4">
          <h4>Valor</h4>
          <form>
            <input placeholder="Digite o valor" type="number" />
          </form>
        </div>


        <div class="box5">
          <h4>Resultado</h4>
          <!-- Centralizar -->
          <div class="box51"></div>
          <button>Converter</button>
        </div>
      </div>
    </main>
  </body>
  <footer>
    <!-- Centralizar -->
    <p>&copy; Ander Moreno| 2026</p>
  </footer>
</html>
